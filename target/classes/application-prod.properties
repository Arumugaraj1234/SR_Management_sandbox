#URL for Machine condition check sheet:
app.mcsheeturl = http://localhost:8587/vmfg/mqttsender/
spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER

#Connection Pool Configuration
spring.datasource.tomcat.initial-size=20
spring.datasource.tomcat.max-wait=20000
spring.datasource.tomcat.max-active=50
spring.datasource.tomcat.max-idle=20
spring.datasource.tomcat.min-idle=15
spring.datasource.tomcat.default-auto-commit=true
spring.datasource.tomcat.test-on-borrow=false
spring.datasource.tomcat.testWhileIdle = true
spring.datasource.tomcat.timeBetweenEvictionRunsMillis = 300000
spring.datasource.tomcat.validationQuery = SELECT 1

#search multipart
spring.http.multipart.max-file-size=10MB
spring.http.multipart.max-request-size=10MB

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


#logging Configuration USED IN LOGBACK.xml
logging.config=classpath:logback-prod.xml
logging.file.name=smartrun-40-log/

